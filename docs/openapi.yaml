# Gerado por `npm run openapi -w api` a partir dos schemas zod. Não edite à mão.
openapi: 3.1.0
info:
  title: Mapp API
  version: 1.0.0
  description: Dados históricos de COVID-19 por país (casos e mortes). Só leitura.
    Sempre exiba a data de referência e a fonte.
paths:
  /health:
    get:
      summary: A API está no ar
      responses:
        "200":
          description: API no ar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: A API tem dados carregados
      responses:
        "200":
          description: Pronta para servir dados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: "DATA_NOT_READY: sem dados ou banco indisponível"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/meta:
    get:
      summary: Fonte, licença, cobertura, data de referência e último sync
      responses:
        "200":
          description: Metadados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "429": &a1
          description: "RATE_LIMITED: mais de 120 requisições por minuto"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500": &a2
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/global:
    get:
      summary: Totais globais (soma dos países) numa data
      parameters:
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data no formato YYYY-MM-DD. Sem ela, vale a data de referência.
      responses:
        "200":
          description: Totais globais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalResponse"
        "400": &a3
          description: "VALIDATION_ERROR: parâmetro inválido ou data fora da cobertura"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429": *a1
        "500": *a2
        "503": &a4
          description: "DATA_NOT_READY: nenhum dado carregado ainda"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/countries:
    get:
      summary: Países para o mapa, com o valor da métrica na data
      parameters:
        - in: query
          name: metric
          schema:
            default: cases
            $ref: "#/components/schemas/Metric"
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data no formato YYYY-MM-DD. Sem ela, vale a data de referência.
      responses:
        "200":
          description: Lista de países
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountriesListResponse"
        "400": *a3
        "429": *a1
        "500": *a2
        "503": *a4
  /api/v1/countries/{code}:
    get:
      summary: Detalhe de um país, com participação % e posição no ranking
      parameters:
        - in: path
          name: code
          schema:
            description: Código ISO3 do país (maiúsculas ou minúsculas)
            type: string
            pattern: ^[A-Za-z]{3}$
          required: true
          description: Código ISO3 do país (maiúsculas ou minúsculas)
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data no formato YYYY-MM-DD. Sem ela, vale a data de referência.
      responses:
        "200":
          description: Detalhe do país
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryDetailResponse"
        "400": *a3
        "404":
          description: COUNTRY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429": *a1
        "500": *a2
        "503": *a4
  /api/v1/rankings:
    get:
      summary: Ranking dos países pela métrica numa data (RN-05), com participação %
      parameters:
        - in: query
          name: metric
          schema:
            default: cases
            $ref: "#/components/schemas/Metric"
        - in: query
          name: limit
          schema:
            default: 10
            description: Quantos países devolver (1 a 50)
            type: integer
            minimum: 1
            maximum: 50
          description: Quantos países devolver (1 a 50)
        - in: query
          name: date
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Data no formato YYYY-MM-DD. Sem ela, vale a data de referência.
      responses:
        "200":
          description: Ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingsResponse"
        "400": *a3
        "429": *a1
        "500": *a2
        "503": *a4
components:
  schemas:
    Metric:
      type: string
      enum:
        - cases
        - deaths
      description: cases = casos, deaths = mortes
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          const: ready
        dataVersion:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        referenceDate:
          type: string
      required:
        - status
        - dataVersion
        - referenceDate
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - COUNTRY_NOT_FOUND
                - NOT_FOUND
                - RATE_LIMITED
                - DATA_NOT_READY
                - INTERNAL_ERROR
            message:
              type: string
            details:
              anyOf:
                - {}
                - type: "null"
            requestId:
              type: string
          required:
            - code
            - message
            - details
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    MetaResponse:
      type: object
      properties:
        source:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
            url:
              type: string
            license:
              type: string
            attribution:
              type: string
          required:
            - code
            - name
            - url
            - license
            - attribution
          additionalProperties: false
        coverage:
          anyOf:
            - type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                countries:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - from
                - to
                - countries
              additionalProperties: false
            - type: "null"
        referenceDate:
          type:
            - string
            - "null"
        lastSync:
          anyOf:
            - type: object
              properties:
                status:
                  type: string
                  enum:
                    - success
                    - partial
                    - failed
                mode:
                  type: string
                  enum:
                    - snapshot
                    - full
                startedAt:
                  type: string
                finishedAt:
                  type: string
              required:
                - status
                - mode
                - startedAt
                - finishedAt
              additionalProperties: false
            - type: "null"
        dataVersion:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        nonGeographic:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
            required:
              - code
              - name
            additionalProperties: false
      required:
        - source
        - coverage
        - referenceDate
        - lastSync
        - dataVersion
        - nonGeographic
      additionalProperties: false
    GlobalResponse:
      type: object
      properties:
        date:
          type: string
        cases:
          $ref: "#/components/schemas/MetricValue"
        deaths:
          $ref: "#/components/schemas/MetricValue"
        countryCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - date
        - cases
        - deaths
        - countryCount
      additionalProperties: false
    MetricValue:
      type: object
      properties:
        total:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        new:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - total
        - new
      additionalProperties: false
    CountriesListResponse:
      type: object
      properties:
        date:
          type: string
        metric:
          $ref: "#/components/schemas/Metric"
        countries:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              lat:
                type:
                  - number
                  - "null"
              lng:
                type:
                  - number
                  - "null"
              total:
                anyOf:
                  - type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  - type: "null"
              new:
                anyOf:
                  - type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  - type: "null"
            required:
              - code
              - name
              - lat
              - lng
              - total
              - new
            additionalProperties: false
      required:
        - date
        - metric
        - countries
      additionalProperties: false
    CountryDetailResponse:
      type: object
      properties:
        date:
          type: string
        country:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
            lat:
              type:
                - number
                - "null"
            lng:
              type:
                - number
                - "null"
            population:
              anyOf:
                - type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                - type: "null"
          required:
            - code
            - name
            - lat
            - lng
            - population
          additionalProperties: false
        cases:
          anyOf:
            - $ref: "#/components/schemas/MetricValue"
            - type: "null"
        deaths:
          anyOf:
            - $ref: "#/components/schemas/MetricValue"
            - type: "null"
        comparison:
          type: object
          properties:
            cases:
              $ref: "#/components/schemas/MetricComparison"
            deaths:
              $ref: "#/components/schemas/MetricComparison"
          required:
            - cases
            - deaths
          additionalProperties: false
      required:
        - date
        - country
        - cases
        - deaths
        - comparison
      additionalProperties: false
    MetricComparison:
      type: object
      properties:
        share:
          type:
            - number
            - "null"
        rank:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        rankedCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - share
        - rank
        - rankedCount
      additionalProperties: false
    RankingsResponse:
      type: object
      properties:
        date:
          type: string
        metric:
          $ref: "#/components/schemas/Metric"
        rankedCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        items:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              code:
                type: string
              name:
                type: string
              total:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              new:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              share:
                type:
                  - number
                  - "null"
            required:
              - rank
              - code
              - name
              - total
              - new
              - share
            additionalProperties: false
      required:
        - date
        - metric
        - rankedCount
        - items
      additionalProperties: false
