<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard histórico de COVID-19: mapa-múndi, casos e mortes por país e no mundo, ranking e gráficos."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mapp — COVID-19</title>
    <script>
      // Applies the theme before the bundle loads, so the page never flashes the wrong one.
      // Same key and rule as web/src/shared/theme/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('mapp-theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
