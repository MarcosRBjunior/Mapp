name: Sync

# Manual only. The default source (JHU CSSE CSV) costs two downloads per run; API Ninjas spends quota.
# Needs the production database and secrets (F9).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: snapshot (só a data de referência) ou full (série histórica; com a JHU, 2 downloads)
        type: choice
        options: [snapshot, full]
        default: snapshot

permissions:
  contents: read

env:
  # Turns off the telemetry of @scarf/scarf (a dependency of swagger-ui-express).
  SCARF_ANALYTICS: 'false'

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # Worst case can exceed this (retries with Retry-After); a killed run becomes an orphan and the next run recovers it.
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Secrets live only in this step, so install scripts never see them.
      # The mode reaches the shell only through an environment variable, never interpolated.
      - run: npm run sync -w api -- "--mode=$SYNC_MODE"
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          # Only read when DATA_PROVIDER=api_ninjas.
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'jhu_csv' }}
          SYNC_MODE: ${{ inputs.mode }}
